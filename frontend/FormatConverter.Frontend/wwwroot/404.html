<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Redirigiendo...</title>
    <script>
        // Fallback SPA: Convierte la ruta en ?p=/ruta y asi Blazor la restaura
        var l = window.location;
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 2).join('/') + '/?p=/' + l.pathname.slice(2).join('/'.replace(/&/g, '~and~') + (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '');
    </script>
</head>
<body>

</body>
</html>
