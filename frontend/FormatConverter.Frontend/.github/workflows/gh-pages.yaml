name: Deploy Frontend a GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Reescribir base href
        uses: SteveSandersonMS/ghaction-rewrite-base-href@v1
        with:
          working_directory: frontend/FormatConverter.Frontend/wwwroot
          base_href: /Format-Converter/

      - name: Publicar
        run: dotnet publish frontend/FormatConverter.Frontend -c Release -o publish

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4