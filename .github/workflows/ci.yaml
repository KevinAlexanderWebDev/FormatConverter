name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Validar appsettings.json
        run: python -m json.tool frontend/FormatConverter.Frontend/wwwroot/appsettings.json

      - name: Tests backend
        working-directory: backend
        run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Release
        run: dotnet build frontend/FormatConverter.Frontend -c Release